<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aziz Ben Amor</title>
    <link rel="canonical" href="https://lebasupreme.github.io/" />
    <!-- GitHub Pages serves this for /terminal. Keep the path, then load the app. -->
    <script>
      (function () {
        try {
          var path = location.pathname + location.search + location.hash;
          if (path !== "/") sessionStorage.setItem("spa-redirect", path);
        } catch (e) {}
        location.replace("/");
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=/" />
  </head>
  <body>
    <p><a href="/">Aziz Ben Amor</a></p>
  </body>
</html>
